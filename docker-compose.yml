# Main docker-compose file for easy access
version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: atrean-postgres
    environment:
      POSTGRES_DB: atx_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: atx_pw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atx}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atrean-network

  app:
    build: .
    container_name: atrean-app
    environment:
      - DATABASE_URL=postgresql://postgres:atx_pw@postgres:5432/atx_db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - VECTOR_STORE_TYPE=faiss
      - VECTOR_STORE_PATH=/app/data/vector_store
      - DEBUG=true
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"  # FastAPI
    volumes:
      - ./data:/app/data
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - atrean-network
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        python scripts/load_dataset.py &&
        echo 'Starting FastAPI server...' &&
        python -m api.main
      "

  streamlit:
    build: .
    container_name: atrean-streamlit
    environment:
      - DATABASE_URL=postgresql://postgres:atx_pw@postgres:5432/atx_db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - API_BASE_URL=http://app:8000  # Use Docker service name for container-to-container communication
    ports:
      - "8501:8501"
    volumes:
      - ./ui:/app/ui
      - .:/app
    depends_on:
      - app
    networks:
      - atrean-network
    command: streamlit run ui/streamlit_app.py --server.port=8501 --server.address=0.0.0.0

networks:
  atrean-network:
    driver: bridge

volumes:
  postgres_data:
